            // 显示版本号
            (async function showVersion() {
                var ver = (typeof CONFIG !== 'undefined' && CONFIG.version) ? CONFIG.version : '';
                try {
                    var info = await API.getSystemInfo();
                    if (info && info.mainVersion) ver = info.mainVersion;
                } catch(e) {}
                if (ver) {
                    document.getElementById('app-version').textContent = 'v' + ver.replace(/^v/i, '');
                }
            })();

</script>
