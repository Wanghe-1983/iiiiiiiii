    <script src="module-challenge.js?v=20260518190000"></script>
    <script>
            // 显示版本号
            (async function showVersion() {
                var hash = '';
                try {
                    var info = await API.getSystemInfo();
                    if (info && info.commitHash) hash = info.commitHash.substring(0, 7);
                } catch(e) {}
                if (hash) {
                    var el = document.getElementById('app-version');
                    if (el) el.textContent = hash;
                    // 记录本次 hash 到 sessionStorage，下次加载对比
                    var prevHash = sessionStorage.getItem('fmi_commit_hash');
                    sessionStorage.setItem('fmi_commit_hash', hash);
                    if (prevHash && prevHash !== hash) {
                        // hash 变化说明部署了新版本，提示用户刷新
                        if (confirm('检测到新版本 (' + hash + ')，点击确定刷新页面以加载最新内容。')) {
                            location.reload(true);
                        }
                    }
                }
            })();

</script>
    <!-- app-v2.js 已移除，课程模块集成到 app.js -->
<div class="app-version" id="app-version"></div>
</body>
